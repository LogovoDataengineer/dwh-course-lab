# Таблицы Iceberg: тот же каталог в PostgreSQL (база iceberg), что у Spark, файлы в MinIO
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lake
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/iceberg
iceberg.jdbc-catalog.connection-user=dwh
iceberg.jdbc-catalog.connection-password=dwh
iceberg.jdbc-catalog.default-warehouse-dir=s3://lake/iceberg
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=dwhadmin
s3.aws-secret-key=dwh-admin-123
