# S3 (MinIO) через s3a: файлы озера, Delta Lake
spark.hadoop.fs.s3a.endpoint                http://minio:9000
spark.hadoop.fs.s3a.path.style.access       true
spark.hadoop.fs.s3a.connection.ssl.enabled  false
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider
# Iceberg и Delta в одной сессии
spark.sql.extensions  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog  org.apache.spark.sql.delta.catalog.DeltaCatalog
# Каталог Iceberg «lake»: метаданные таблиц в PostgreSQL (база iceberg), файлы в s3://lake/iceberg
spark.sql.catalog.lake                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lake.type           jdbc
spark.sql.catalog.lake.uri            jdbc:postgresql://postgres:5432/iceberg
spark.sql.catalog.lake.jdbc.user      dwh
spark.sql.catalog.lake.jdbc.password  dwh
spark.sql.catalog.lake.warehouse      s3://lake/iceberg
spark.sql.catalog.lake.io-impl        org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint    http://minio:9000
spark.sql.catalog.lake.s3.path-style-access true
spark.sql.catalog.lake.client.region  us-east-1
spark.ui.showConsoleProgress false
spark.driver.memory 2g
